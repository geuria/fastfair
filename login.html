<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cliente - FAST & FAIR</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Cabeçalho padrão -->
    <header>
        <div class="header-left">
            <a href="escolher_tipo.html" class="btn-voltar">← Voltar</a>
        </div>

        <div class="header-right">
            <a href="login.html" class="btn-topo">Login</a>
            <a href="escolher_tipo.html" class="btn-topo">Cadastro</a>
            <img src="img/logo.jpg" alt="FAST & FAIR" class="logo">
        </div>
    </header>

    <main class="content">
        <div class="login-container">
            <h1>Cadastro de Cliente</h1>

            <div class="login-box">

                <label>Nome completo</label>
                <input type="text" id="nome" placeholder="Seu nome">

                <label>Email</label>
                <input type="email" id="email" placeholder="Seu email">

                <label>Senha</label>
                <input type="password" id="senha" placeholder="Crie uma senha">

                <label>CPF</label>
                <input type="text" id="cpf" placeholder="000.000.000-00">

                <label>Endereço</label>
                <input type="text" id="endereco" placeholder="Rua, número, bairro">

                <label>Telefone</label>
                <input type="text" id="telefone" placeholder="(00) 00000-0000">

                <button type="button" onclick="usarLocalizacao()">Usar minha localização</button>

                <button type="submit" onclick="cadastrarCliente()">Cadastrar</button>

            </div>
        </div>
    </main>

    <script src="js/cadastro_cliente.js"></script>

</body>
</html>
