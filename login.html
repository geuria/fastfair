<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FAST & FAIR</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Cabeçalho padrão -->
    <header>
        <div class="header-left">
            <a href="index.html" class="btn-voltar">Voltar</a>
            <img src="img/logo.jpg" alt="FAST & FAIR" class="logo">
        </div>

        <div class="header-right">
            <a href="login.html" class="btn-topo">Login</a>
            <a href="cadastro.html" class="btn-topo">Cadastro</a>
            <a href="carrinho.html" class="btn-topo">Carrinho</a>
        </div>
    </header>

    <!-- Conteúdo principal -->
    <main class="content">
        <div class="login-container">
            <h1>Login</h1>

            <div class="login-box">
                <label>Email</label>
                <input type="email" id="email" placeholder="Seu email" required>

                <label>Senha</label>
                <input type="password" id="senha" placeholder="Sua senha" required>

                <button type="submit" onclick="fazerLogin()">Entrar</button>
            </div>
        </div>
    </main>

    <!-- Script de validação -->
    <script>
        function validarSenha(senha) {
            // mínimo 8 caracteres, pelo menos uma letra, um número e um caractere especial
            const regex = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[@#$%^&+=!]).{8,}$/;
            return regex.test(senha);
        }

        function fazerLogin() {
            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;

            if (!validarSenha(senha)) {
                alert("A senha deve ter no mínimo 8 caracteres, incluir letras, números e pelo menos um símbolo (@, #, $, etc).");
                return;
            }

            // Aqui você faria a chamada ao servidor para validar email/senha
            // Exemplo fictício:
            // fetch("/api/login", { method: "POST", body: JSON.stringify({ email, senha }) })

            alert("Login enviado com sucesso!");
        }
    </script>

</body>
</html>
