<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro do Entregador</title>

    <!-- CSS correto -->
    <link rel="stylesheet" href="css/entregador.css">

    <!-- Supabase carregado corretamente -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>

<body>

    <!-- Cabeçalho padrão -->
    <header>
        <div class="header-left">
            <a href="escolher_tipo.html" class="btn-voltar">← Voltar</a>
        </div>

        <div class="header-right">
            <a href="login.html" class="btn-topo">Login</a>
            <a href="escolher_tipo.html" class="btn-topo">Cadastro</a>
            <img src="img/logo.jpg" alt="FAST & FAIR" class="logo">
        </div>
    </header>

    <main class="content">
        <div class="login-container">
            <h1>Cadastro de Entregador</h1>

            <div class="login-box">

                <label>Nome completo</label>
                <input type="text" id="nome" placeholder="Seu nome">

                <label>Email</label>
                <input type="email" id="email" placeholder="Seu email">

                <label>Senha</label>
                <input type="password" id="senha" placeholder="Crie uma senha">

                <label>CPF</label>
                <input type="text" id="cpf" placeholder="000.000.000-00">

                <label>Telefone</label>
                <input type="text" id="telefone" placeholder="(00) 00000-0000">

                <label>Tipo de Veículo</label>
                <select id="veiculo">
                    <option value="moto">Moto</option>
                    <option value="carro">Carro</option>
                    <option value="bicicleta">Bicicleta</option>
                </select>

                <label>Placa do Veículo (se houver)</label>
                <input type="text" id="placa" placeholder="ABC-1234">

                <label>Enviar CNH (PDF ou Imagem)</label>
                <input type="file" id="cnh" accept=".pdf,.jpg,.jpeg,.png">

                <button type="button" onclick="usarLocalizacao()">Usar minha localização</button>

                <button type="submit" onclick="cadastrarEntregador()">Cadastrar</button>

            </div>
        </div>
    </main>

    <!-- JS do entregador -->
    <script src="js/cadastro_entregador.js"></script>

</body>
</html>
