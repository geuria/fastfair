<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel do Cliente</title>

<link rel="stylesheet" href="../css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
    table {
        width: 95%;
        margin: 20px auto;
        border-collapse: collapse;
        background: rgba(255,255,255,0.85);
        border-radius: 10px;
        overflow: hidden;
    }
    th, td {
        padding: 12px;
        border-bottom: 1px solid #ccc;
        text-align: left;
        font-size: 18px;
    }
    th {
        background: #2E7D32;
        color: white;
    }
    tr:hover {
        background: #E8F5E9;
    }
</style>

</head>

<body>

<div class="overlay"></div>

<header>
    <img src="../img/logo.png" alt="FAST & FAIR">
</header>

<nav class="menu">
    <a href="../login.html" class="menu-btn">Sair</a>
</nav>

<div class="content">
    <h1>Meus Pedidos</h1>

    <table>
        <thead>
            <tr>
                <th>Produtor</th>
                <th>Produto</th>
                <th>Qtd</th>
                <th>Total</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="listaPedidos">
            <tr><td colspan="5">Carregando...</td></tr>
        </tbody>
    </table>
</div>

<script>
const { createClient } = supabase;

const db = createClient(
    "https://iqpyptpacglgoawlvyai.supabase.co",
    "sb_publishable_f6rQubRvqp2V1GBD-YI1yQ_Zd7A_7BW"
);

// Proteção
const cliente = localStorage.getItem("usuario");
const tipo = localStorage.getItem("tipo");

if (!cliente || tipo !== "cliente") {
    alert("Acesso permitido somente ao cliente.");
    window.location.href = "../login.html";
}

async function carregarPedidos() {
    const tabela = document.getElementById("listaPedidos");

    const { data } = await db
        .from("pedidos")
        .select(`
            *,
            produtor:produtor_id (nome),
            produto:produto_id (nome)
        `)
        .eq("cliente_id", cliente);

    tabela.innerHTML = "";

    data.forEach(p => {
        tabela.innerHTML += `
            <tr>
                <td>${p.produtor?.nome}</td>
                <td>${p.produto?.nome}</td>
                <td>${p.quantidade}</td>
                <td>R$ ${Number(p.total).toFixed(2)}</td>
                <td>${p.status}</td>
            </tr>
        `;
    });
}

carregarPedidos();
</script>

</body>
</html>
