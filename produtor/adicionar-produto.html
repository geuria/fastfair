<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adicionar Produto - FAST & FAIR</title>

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/produtor.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<<header>
    <div class="header-left">
        <a href="index.html" class="btn-voltar">Voltar</a>
        <img src="img/logo.jpg" alt="FAST & FAIR" class="logo">
    </div>

    <div class="header-right">
        <a href="login.html" class="btn-topo">Login</a>
        <a href="cadastro.html" class="btn-topo">Cadastro</a>
        <a href="carrinho.html" class="btn-topo">Carrinho</a>
    </div>
</header>


<!-- Botão Voltar -->
<a href="javascript:history.back()" class="btn-voltar">← Voltar</a>

<div class="login-container">

    <h1 class="texto-3d texto-contorno" style="text-align:center;">Adicionar Produto</h1>

    <form id="formProduto" class="login-box">

        <label class="texto-3d texto-contorno">Nome do Produto</label>
        <input type="text" id="nome" placeholder="Ex: Tomate, Alface, Banana" required>

        <label class="texto-3d texto-contorno">Preço (R$)</label>
        <input type="number" id="preco" step="0.01" placeholder="Ex: 5.50" required>

        <label class="texto-3d texto-contorno">Quantidade</label>
        <input type="number" id="quantidade" placeholder="Ex: 20" required>

        <label class="texto-3d texto-contorno">Categoria</label>
        <select id="categoria" required>
            <option value="Frutas">Frutas</option>
            <option value="Legumes">Legumes</option>
            <option value="Verduras">Verduras</option>
            <option value="Orgânicos">Orgânicos</option>
        </select>

        <button type="submit" class="login-btn texto-3d">Cadastrar Produto</button>

    </form>

</div>

<script>
const { createClient } = supabase;

const db = createClient(
    "https://iqpyptpacglgoawlvyai.supabase.co",
    "sb_publishable_f6rQubRvqp2V1GBD-YI1yQ_Zd7A_7BW"
);

// Proteção
const produtor = localStorage.getItem("usuario");
const tipo = localStorage.getItem("tipo");

if (!produtor || tipo !== "produtor") {
    alert("Acesso permitido somente ao produtor.");
    window.location.href = "../login.html";
}

document.getElementById("formProduto").addEventListener("submit", async e => {
    e.preventDefault();

    const produto = {
        nome: document.getElementById("nome").value,
        preco: document.getElementById("preco").value,
        quantidade: document.getElementById("quantidade").value,
        categoria: document.getElementById("categoria").value,
        produtor_id: produtor
    };

    await db.from("produtos").insert(produto);

    alert("Produto cadastrado com sucesso!");
    location.href = "meus-produtos.html";
});
</script>

</body>
</html>
